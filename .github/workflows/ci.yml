name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version   # keep equal to the training Python (see model_metadata.json)
          cache: pip
      - run: pip install -r requirements-serve.txt -r requirements-dev.txt
      - run: python -m pytest -q
